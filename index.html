<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scorecard</title>
<meta name="theme-color" content="#2F6B45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scorecard">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --paper:#F7F9F4; --card:#FFFFFF; --ink:#17321F; --muted:#5C6B61; --line:#D3DCD1;
  --green:#2F6B45; --on-green:#FFFFFF; --flag:#E3B505; --on-flag:#17321F; --warn:#A2401F;
  --cond:'Avenir Next Condensed','Arial Narrow',sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#0E1712; --card:#16221B; --ink:#E4ECE6; --muted:#9AAC9F; --line:#2B3B31;
    --green:#5FA77A; --on-green:#0E1712; --flag:#F2C94C; --on-flag:#0E1712; --warn:#E58A68; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font:17px/1.45 -apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.num,h1,h2,.btn,.seg button,.flag{font-family:var(--cond)}
main{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:2rem;font-weight:700;margin:.2em 0 .1em;line-height:1.1}
h2{font-size:1.25rem;font-weight:600;margin:1.6em 0 .5em}
p{margin:.4em 0}
.muted{color:var(--muted)} .small{font-size:.88rem}
.error{color:var(--warn);font-weight:500}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--flag);outline-offset:2px}

.btn{display:flex;align-items:center;justify-content:center;gap:.4em;width:100%;min-height:52px;
  border:1.5px solid var(--green);background:transparent;color:var(--green);border-radius:10px;
  font-size:1.2rem;font-weight:600;cursor:pointer;margin:.5em 0;padding:0 1em;text-align:center}
.btn.primary{background:var(--green);color:var(--on-green)}
.btn.big{min-height:60px;font-size:1.35rem}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--green);font-weight:600;padding:.4em 0;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;min-height:40px}

.hero{padding:.6em 0 .8em;border-bottom:1.5px solid var(--line);margin-bottom:1em;text-align:center}
.hero .brand{color:var(--green);font-size:2.3rem;font-weight:700;margin:0 0 .15em;line-height:1.05}
[hidden]{display:none !important}
.hero .idx{font-size:5.5rem;font-weight:700;line-height:.95;letter-spacing:-.01em}
.banner{border:1.5px solid var(--flag);border-radius:10px;padding:.8em 1em;margin:1em 0}
.banner .row{display:flex;gap:.6em}
.banner .btn{margin:.5em 0 0}

.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:1em;
  background:none;border:0;border-bottom:1px solid var(--line);padding:.8em 0;text-align:left;cursor:pointer}
.list .r{text-align:right;white-space:nowrap}
.list .big{font-family:var(--cond);font-size:1.5rem;font-weight:600}

label.field{display:block;margin:.7em 0;font-size:.9rem;color:var(--muted);font-weight:500}
input,select,textarea{display:block;width:100%;margin-top:.25em;font:inherit;font-size:1.05rem;color:var(--ink);
  background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:.6em .7em}
textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
.seg{display:flex;border:1.5px solid var(--green);border-radius:10px;overflow:hidden;margin:.4em 0}
.seg button{flex:1;min-height:48px;background:transparent;border:0;border-left:1.5px solid var(--green);
  color:var(--green);font-size:1.15rem;font-weight:600;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--green);color:var(--on-green)}

.hole-table{width:100%;border-collapse:collapse}
.hole-table th{font-size:.8rem;color:var(--muted);font-weight:500;text-align:left;padding:.2em .2em}
.hole-table td{padding:.2em}
.hole-table td:first-child{font-family:var(--cond);font-weight:600;font-size:1.2rem;width:2.4em}
.hole-table input{margin:0;padding:.45em .5em;text-align:center}

/* The scorecard strip: the one place that looks like the paper card */
.strip-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px 4px}
.strip{display:flex;border:1.5px solid var(--ink);border-radius:6px;width:max-content;min-width:100%}
.cell{flex:1;min-width:38px;background:none;border:0;border-left:1px solid var(--line);padding:4px 0 6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px}
.cell:first-child{border-left:0}
.cell.tot{cursor:default;border-left:1.5px solid var(--ink);min-width:44px}
.cell .hn{font-size:.72rem;color:var(--muted);font-weight:600}
.cell.on{background:var(--flag);color:var(--on-flag)}
.cell.on .hn{color:var(--on-flag)}
.sc{font-family:var(--cond);font-size:1.15rem;font-weight:600;width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;line-height:1}
.sc.birdie{border:1.5px solid currentColor;border-radius:50%}
.sc.eagle{border:1.5px solid currentColor;border-radius:50%;box-shadow:0 0 0 2px var(--card),0 0 0 3.5px currentColor}
.sc.bogey{border:1.5px solid currentColor}
.sc.double{border:1.5px solid currentColor;box-shadow:0 0 0 2px var(--card),0 0 0 3.5px currentColor}
.cell.on .sc.eagle,.cell.on .sc.double{box-shadow:0 0 0 2px var(--flag),0 0 0 3.5px currentColor}

.hole-head{display:flex;align-items:center;gap:14px;margin:1.1em 0 .6em}
.flag{background:var(--flag);color:var(--on-flag);font-size:2.6rem;font-weight:700;min-width:68px;height:68px;
  display:flex;align-items:center;justify-content:center;border-radius:4px 22px 22px 4px;padding:0 .2em}
.hole-head .par{font-size:1.7rem;font-weight:700;line-height:1}
.running{margin-left:auto;text-align:right}
.running .num{font-size:2rem;font-weight:700;line-height:1;display:block}

.block{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:.8em 1em;margin:.7em 0}
.block .lbl{font-size:.9rem;color:var(--muted);font-weight:500}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;margin-top:.3em}
.stepper button.step{height:64px;border-radius:50%;border:1.5px solid var(--green);background:transparent;
  color:var(--green);font-size:2rem;font-weight:500;cursor:pointer;line-height:1}
.stepper .val{background:none;border:0;cursor:pointer;font-family:var(--cond);
  font-size:3.6rem;font-weight:700;line-height:1;text-align:center}
.stepper .val.ghost{color:var(--line)}
.rel{text-align:center;color:var(--muted);font-size:.92rem;min-height:1.3em}
.notes-area{min-height:64px}
.navrow{display:grid;grid-template-columns:1fr 2fr;gap:.6em;margin-top:.8em}
.navrow .btn{margin:0}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em;margin:1em 0}
.stats div{border-top:1.5px solid var(--ink);padding-top:.3em}
.stats .num{font-size:2rem;font-weight:700;line-height:1.1;display:block}
.review{width:100%;border-collapse:collapse;font-size:.95rem}
.review th,.review td{padding:.4em .3em;border-bottom:1px solid var(--line);text-align:center}
.review th{color:var(--muted);font-weight:500;font-size:.8rem}
.review td:first-child,.review th:first-child{text-align:left}
.working{font-weight:500}
.working::after{content:'';display:inline-block;width:.9em;height:.9em;margin-left:.5em;vertical-align:-.1em;
  border:2px solid var(--green);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.working::after{animation:none}}
.banner.warn{border-color:var(--warn)}
.gear{background:none;border:0;color:var(--green);font-weight:600;cursor:pointer;padding:.4em 0}
body{overscroll-behavior-y:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--paper);padding:.7em 1.1em;border-radius:10px;max-width:90vw;font-weight:500;z-index:9}
</style>
</head>
<body>
<main>
  <section id="home"></section>
  <section id="new" hidden></section>
  <section id="setup" hidden></section>
  <section id="play" hidden></section>
  <section id="summary" hidden></section>
  <section id="round" hidden></section>
  <section id="settings" hidden></section>
</main>
<div id="toast" role="status" hidden></div>

<script>
const S = { data: null, setup: null, round: null, holeIdx: 0, viewing: null };
const DRAFT_KEY = 'golf-scorecard-draft-v1', CFG_KEY = 'golf-cfg-v1', CACHE_KEY = 'golf-data-v1', OUTBOX_KEY = 'golf-outbox-v1';
function store(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k, d){ try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } }
let CFG = load(CFG_KEY, null);
const isStandalone = () => window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const $ = (sel, root = document) => root.querySelector(sel);

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function call(action, ...args){
  return callWith(CFG, action, ...args);
}
async function callWith(cfg, action, ...args){
  if (!cfg || !cfg.url) throw new Error('Connect the app to your Google Sheet in Settings.');
  let res;
  try {
    res = await fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: cfg.token, action, args }) });
  } catch (e) {
    const err = new Error(navigator.onLine ? 'Could not reach your Google Sheet.' : 'No signal right now.');
    err.offline = true; throw err;
  }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('That web app URL did not answer like the scorecard server. Check it in Settings.'); }
  if (!j.ok){ const err = new Error(j.error || 'Request failed.'); err.code = j.code; throw err; }
  return j.result;
}

const outbox = () => load(OUTBOX_KEY, []);
let flushing = false;
async function flushOutbox(){
  if (flushing || !CFG || !outbox().length) return;
  flushing = true;
  let sent = 0;
  try {
    for (const p of outbox()){
      S.data = await call('saveRound', p);
      store(CACHE_KEY, S.data);
      store(OUTBOX_KEY, outbox().filter(x => x.id !== p.id));
      sent++;
    }
  } catch (e) { /* stays queued; tries again when signal returns */ }
  finally {
    flushing = false;
    if (sent) toast(sent === 1 ? 'Round uploaded to your Google Sheet.' : sent + ' rounds uploaded to your Google Sheet.');
    if (!$('#home').hidden) renderHome();
  }
}
function newId(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return 'R' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + Math.random().toString(36).slice(2, 5);
}
function errMsg(e){ return (e && e.message) ? e.message : String(e); }
function show(id){ for (const s of document.querySelectorAll('main > section')) s.hidden = s.id !== id; window.scrollTo(0, 0); }
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3500); }

function saveDraft(){ try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ round: S.round, holeIdx: S.holeIdx })); } catch (e) {} }
function loadDraft(){ try { const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); return d && d.round ? d : null; } catch (e) { return null; } }
function clearDraft(){ try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

const num = v => (v === '' || v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
const sum = (arr, f) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fmtDate = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); };
const toPar = n => n === 0 ? 'E' : (n > 0 ? '+' + n : String(n));
const fmtIndex = i => i == null ? '–' : (i < 0 ? '+' + Math.abs(i).toFixed(1) : i.toFixed(1));
function relName(score, par){
  if (score === 1) return 'Hole in one';
  const d = score - par;
  return ({'-3':'Albatross','-2':'Eagle','-1':'Birdie','0':'Par','1':'Bogey','2':'Double bogey','3':'Triple bogey'})[d] || toPar(d);
}
function mark(h){
  if (h.score == null) return '';
  const d = h.score - h.par;
  return d <= -2 ? 'eagle' : d === -1 ? 'birdie' : d === 1 ? 'bogey' : d >= 2 ? 'double' : '';
}

// ---------- Home
async function boot(){
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  S.data = load(CACHE_KEY, null);
  if (!CFG){ renderSettings(true); show('settings'); return; }
  renderHome(); show('home');
  refresh();
}
async function refresh(){
  await flushOutbox();
  try { S.data = await call('getAppData'); store(CACHE_KEY, S.data); if (!$('#home').hidden) renderHome(); }
  catch (e) { if (!$('#home').hidden) renderHome(e.offline ? '' : errMsg(e)); }
}
window.addEventListener('online', refresh);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && CFG) refresh(); });

function renderHome(status){
  const d = S.data, draft = loadDraft();
  const idx = d ? fmtIndex(d.index) : '…';
  const note = !d ? 'Loading your rounds' :
    d.index != null ? 'Handicap Index, estimated from your last ' + Math.min(20, d.roundCount) + ' rounds' :
    (d.indexText || 'Needs 3 rounds');
  const rounds = d ? d.rounds : [];
  const waiting = outbox();
  $('#home').innerHTML = `
    <nav class="top"><span></span><button class="gear" data-act="settings">Settings</button></nav>
    ${!isStandalone() ? `<div class="banner"><strong>Install the app</strong><p class="muted small">In Safari, tap Share, then Add to Home Screen. Open it from the home screen icon after that.</p></div>` : ''}
    ${waiting.length ? `<div class="banner warn"><strong>${waiting.length === 1 ? '1 round' : waiting.length + ' rounds'} waiting to upload</strong>
      <p class="muted small">Saved on this phone. It uploads automatically when you have signal.</p>
      <button class="btn" data-act="flush">Upload now</button></div>` : ''}
    <header class="hero">
      <h1 class="brand">Zack’s Golf App</h1>
      ${d && d.index != null ? `<div class="idx num">${esc(idx)}</div>` : ''}
      <p class="muted">${esc(note)}</p>
    </header>
    ${draft ? `<div class="banner"><strong>Round in progress</strong>
      <p class="muted small">${esc(draft.round.course)}, hole ${draft.holeIdx + 1} of ${draft.round.holes.length}</p>
      <div class="row"><button class="btn primary" data-act="resume">Resume</button><button class="btn" data-act="discard">Discard</button></div></div>` : ''}
    <button class="btn primary big" data-act="new">New round</button>
    ${status ? `<p class="error">${esc(status)}</p>` : ''}
    <h2>Rounds</h2>
    ${rounds.length ? `<ul class="list">${rounds.map(r => `<li><button data-act="open" data-id="${esc(r.id)}">
        <span><strong>${esc(r.course)}</strong><br><span class="muted small">${esc(fmtDate(r.date))}, ${esc(r.holesPlayed)} holes${r.tees ? ', ' + esc(r.tees) : ''}</span></span>
        <span class="r"><span class="big">${esc(r.gross ?? '')}</span><br><span class="muted small">${r.diff != null ? 'Diff ' + esc(r.diff.toFixed(1)) : 'Not rated'}</span></span>
      </button></li>`).join('')}</ul>`
      : (d ? `<p class="muted">Saved rounds show up here. Start one with the button above.</p>` : '')}
    ${d && d.sheetUrl ? `<p class="small"><a href="${esc(d.sheetUrl)}" target="_blank" rel="noopener">Open the Google Sheet</a></p>` : ''}`;
}

// ---------- Settings
function renderSettings(first){
  const fromSafari = !isStandalone();
  $('#settings').innerHTML = `
    ${first ? '' : `<nav class="top"><button class="link" data-act="home">‹ Rounds</button></nav>`}
    <h1>${first ? 'Connect your Sheet' : 'Settings'}</h1>
    ${first && fromSafari ? `<div class="banner"><strong>Install first</strong><p class="muted small">Tap Share, then Add to Home Screen. Open the new icon and connect there. The home screen app keeps its own settings, separate from Safari.</p></div>` : ''}
    <p class="muted small">Paste the web app URL and access code from your Apps Script setup.</p>
    <label class="field">Web app URL<input id="cfg-url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(CFG ? CFG.url : '')}"></label>
    <label class="field">Access code<input id="cfg-token" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(CFG ? CFG.token : '')}"></label>
    <button class="btn primary big" data-act="cfg-save">Connect</button>
    <div id="cfg-status"></div>
    ${!first ? `<h2>On this phone</h2><p class="muted small">${outbox().length} rounds waiting to upload${loadDraft() ? ', 1 round in progress' : ''}.</p>` : ''}`;
}

async function saveSettings(btn){
  const url = $('#cfg-url').value.trim(), token = $('#cfg-token').value.trim(), st = $('#cfg-status');
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)){ st.innerHTML = '<p class="error">The URL should start with https://script.google.com/ and end with /exec.</p>'; return; }
  if (!token){ st.innerHTML = '<p class="error">Add the access code.</p>'; return; }
  btn.disabled = true; st.innerHTML = '<p class="working">Checking the connection</p>';
  try {
    const data = await callWith({ url, token }, 'getAppData');
    CFG = { url, token }; store(CFG_KEY, CFG); S.data = data; store(CACHE_KEY, data);
    renderHome(); show('home'); toast('Connected to your Google Sheet.'); flushOutbox();
  } catch (e) {
    st.innerHTML = `<p class="error">${esc(errMsg(e))}</p>`; btn.disabled = false;
  }
}

// ---------- New round
function renderNew(){
  const d = S.data || { courses: [], hasKey: true };
  const online = navigator.onLine;
  $('#new').innerHTML = `
    <nav class="top"><button class="link" data-act="home">‹ Rounds</button></nav>
    <h1>New round</h1>
    ${d.hasKey ? '' : `<p class="error">Photo reading is off until you add GEMINI_API_KEY in Script properties.</p>`}
    ${online ? `<label class="btn primary big">Photograph the scorecard<input type="file" accept="image/*" id="photo" hidden></label>`
      : `<p class="error">No signal, so photo reading is off. Reuse a course or enter the card by hand.</p>`}
    <p class="muted small">Lay the card flat in good light with every row in frame. You'll check everything before you tee off.</p>
    <div id="scan-status"></div>
    ${d.courses.length ? `<h2>Or reuse a course</h2><ul class="list">${d.courses.map((c, i) => `<li><button data-act="course" data-i="${i}">
        <span><strong>${esc(c.name)}</strong><br><span class="muted small">${esc(c.tees || 'Tees not set')}${c.rating ? ', ' + esc(c.rating) + ' / ' + esc(c.slope) : ''}</span></span>
        <span class="r muted small">Par ${esc(c.par)}</span></button></li>`).join('')}</ul>` : ''}
    <button class="btn" data-act="manual">Enter the card by hand</button>`;
}

async function onPhoto(file){
  const st = $('#scan-status');
  st.innerHTML = '<p class="working">Reading the scorecard. This takes 10 to 30 seconds.</p>';
  try {
    const b64 = await shrink(file);
    const card = await call('scanScorecard', b64, 'image/jpeg');
    buildSetup(card);
  } catch (e) {
    st.innerHTML = `<p class="error">${esc(errMsg(e))}</p><p class="muted small">Try another photo, or enter the card by hand.</p>`;
  }
}

function shrink(file){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1800 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file could not be opened as a photo.')); };
    img.src = url;
  });
}

function blankCard(n){ return { course: '', holeCount: n, par: Array(n).fill(null), tees: [], strokeIndexRows: [] }; }

function cardFromCourse(c){
  const k = c.card;
  return { course: k.course, holeCount: k.n, par: k.par,
    tees: [{ name: k.tees || '', rating: k.rating, slope: k.slope, yards: k.yards }],
    strokeIndexRows: [{ label: k.siLabel || 'Handicap', values: k.si }] };
}

// ---------- Check the card
function buildSetup(card){
  const n = card.holeCount === 9 ? 9 : 18;
  const tees = card.tees && card.tees.length ? card.tees : [{ name: '', rating: null, slope: null, yards: Array(n).fill(null) }];
  const siRows = card.strokeIndexRows && card.strokeIndexRows.length ? card.strokeIndexRows : [{ label: 'Handicap', values: Array(n).fill(null) }];
  S.setup = {
    course: card.course || '', date: todayISO(), n, tees, teeIdx: 0, siRows, siIdx: 0, mode: n === 18 ? '18' : '9',
    teeName: tees[0].name || '', rating18: num(tees[0].rating), slope: num(tees[0].slope),
    indexBefore: S.data && S.data.index != null ? S.data.index : null,
    holes: Array.from({ length: n }, (_, i) => ({ hole: i + 1, par: num(card.par && card.par[i]),
      yards: num(tees[0].yards && tees[0].yards[i]), si: num(siRows[0].values && siRows[0].values[i]) }))
  };
  S.setup.rating = S.setup.rating18;
  renderSetup(); show('setup');
}

function selectedHoles(s){
  if (s.mode === 'front') return s.holes.slice(0, 9);
  if (s.mode === 'back') return s.holes.slice(9, 18);
  return s.holes;
}
const halfRating = r => r == null ? null : Math.round(r * 5) / 10;

function renderSetup(){
  const s = S.setup, sel = selectedHoles(s), nine = s.mode !== '18';
  $('#setup').innerHTML = `
    <nav class="top"><button class="link" data-act="new">‹ Back</button></nav>
    <h1>Check the card</h1>
    <p class="muted small">Fix anything the photo got wrong. Rating, slope, par and hole handicaps feed your handicap.</p>
    <label class="field">Course<input data-f="course" value="${esc(s.course)}" autocomplete="off"></label>
    <div class="grid2">
      <label class="field">Date<input type="date" data-f="date" value="${esc(s.date)}"></label>
      ${s.tees.length > 1
        ? `<label class="field">Tees<select data-f="teeIdx">${s.tees.map((t, i) => `<option value="${i}" ${i === s.teeIdx ? 'selected' : ''}>${esc(t.name || 'Tee ' + (i + 1))}</option>`).join('')}</select></label>`
        : `<label class="field">Tees<input data-f="teeName" value="${esc(s.teeName)}" placeholder="e.g. White"></label>`}
    </div>
    ${s.n === 18 ? `<div class="lbl muted small">Holes</div><div class="seg">
      ${[['18','18'],['front','Front 9'],['back','Back 9']].map(([m, l]) => `<button data-act="mode" data-m="${m}" class="${s.mode === m ? 'on' : ''}">${l}</button>`).join('')}
    </div>` : ''}
    <div class="grid2">
      <label class="field">Course rating${nine ? ' (9 holes)' : ''}<input inputmode="decimal" data-f="rating" value="${esc(s.rating ?? '')}"></label>
      <label class="field">Slope<input inputmode="numeric" data-f="slope" value="${esc(s.slope ?? '')}"></label>
    </div>
    ${nine && s.n === 18 ? `<p class="muted small">9-hole rating starts at half the 18-hole rating. Use the card's front or back 9 rating if it lists one.</p>` : ''}
    ${s.siRows.length > 1 ? `<label class="field">Hole handicap row<select data-f="siIdx">${s.siRows.map((r, i) => `<option value="${i}" ${i === s.siIdx ? 'selected' : ''}>${esc(r.label)}</option>`).join('')}</select></label>` : ''}
    <label class="field">Your Handicap Index<input inputmode="decimal" data-f="indexBefore" value="${esc(s.indexBefore ?? '')}" placeholder="None yet"></label>
    <h2>Holes</h2>
    <table class="hole-table"><thead><tr><th>Hole</th><th>Par</th><th>Yards</th><th>Handicap</th></tr></thead><tbody>
      ${sel.map(h => `<tr><td>${h.hole}</td>
        <td><input inputmode="numeric" data-h="${h.hole - 1}" data-k="par" value="${esc(h.par ?? '')}"></td>
        <td><input inputmode="numeric" data-h="${h.hole - 1}" data-k="yards" value="${esc(h.yards ?? '')}"></td>
        <td><input inputmode="numeric" data-h="${h.hole - 1}" data-k="si" value="${esc(h.si ?? '')}"></td></tr>`).join('')}
    </tbody></table>
    <p class="muted small">Par ${sum(sel, h => h.par)}</p>
    <button class="btn primary big" data-act="start">Start round</button>`;
}

function setupInput(el){
  const s = S.setup;
  if (el.dataset.h != null){ s.holes[Number(el.dataset.h)][el.dataset.k] = num(el.value); return; }
  const f = el.dataset.f;
  if (f === 'teeIdx'){
    s.teeIdx = Number(el.value); const t = s.tees[s.teeIdx];
    s.teeName = t.name || ''; s.rating18 = num(t.rating); s.slope = num(t.slope);
    s.rating = s.mode === '18' ? s.rating18 : halfRating(s.rating18);
    s.holes.forEach((h, i) => { h.yards = num(t.yards && t.yards[i]); });
    renderSetup(); return;
  }
  if (f === 'siIdx'){
    s.siIdx = Number(el.value); const r = s.siRows[s.siIdx];
    s.holes.forEach((h, i) => { h.si = num(r.values && r.values[i]); });
    renderSetup(); return;
  }
  if (f === 'rating'){ s.rating = num(el.value); if (s.mode === '18') s.rating18 = s.rating; return; }
  if (f === 'slope' || f === 'indexBefore'){ s[f] = num(el.value); return; }
  s[f] = el.value;
}

function startRound(){
  const s = S.setup, sel = selectedHoles(s);
  if (!s.course.trim()) return toast('Add the course name.');
  const noPar = sel.filter(h => !h.par);
  if (noPar.length) return toast('Add par for hole ' + noPar.map(h => h.hole).join(', ') + '.');
  if ((!s.rating || !s.slope) && !confirm('No course rating or slope yet. The round will save but won\'t count toward your handicap. Start anyway?')) return;
  S.round = {
    id: newId(), date: s.date, course: s.course.trim(), tees: s.teeName, holesPlayed: sel.length,
    rating: s.rating, slope: s.slope, indexBefore: s.indexBefore, notes: '',
    holes: sel.map(h => ({ hole: h.hole, par: h.par, yards: h.yards, si: h.si, score: null, putts: null,
      fairway: null, gir: null, girManual: false, notes: '' })),
    card: { course: s.course.trim(), tees: s.teeName, rating: s.rating18, slope: s.slope, n: s.n,
      par: s.holes.map(h => h.par), yards: s.holes.map(h => h.yards), si: s.holes.map(h => h.si),
      siLabel: s.siRows[s.siIdx].label }
  };
  S.holeIdx = 0; saveDraft(); renderPlay(); show('play');
}

// ---------- Play
function renderPlay(){
  const r = S.round, i = S.holeIdx, h = r.holes[i];
  const done = r.holes.filter(x => x.score != null);
  const strip = (from, to, label) => {
    const part = r.holes.slice(from, to);
    const cells = part.map((x, k) => `<button class="cell ${from + k === i ? 'on' : ''}" data-act="jump" data-i="${from + k}" aria-label="Hole ${x.hole}">
      <span class="hn">${x.hole}</span><span class="sc ${mark(x)}">${x.score ?? ''}</span></button>`).join('');
    const t = part.some(x => x.score != null) ? sum(part, x => x.score) : '';
    return cells + (label ? `<div class="cell tot"><span class="hn">${label}</span><span class="sc">${t}</span></div>` : '');
  };
  const cardHtml = r.holes.length === 18 ? strip(0, 9, 'Out') + strip(9, 18, 'In') : strip(0, r.holes.length, 'Tot');
  const info = [h.yards ? h.yards + ' yds' : '', h.si ? 'Handicap ' + h.si : ''].filter(Boolean).join(', ');
  const last = i === r.holes.length - 1;

  $('#play').innerHTML = `
    <nav class="top"><button class="link" data-act="home">‹ Rounds</button><span class="muted small">${esc(r.course)}</span></nav>
    <div class="strip-wrap"><div class="strip">${cardHtml}</div></div>
    <div class="hole-head">
      <div class="flag">${h.hole}</div>
      <div><div class="par num">Par ${h.par}</div><div class="muted small">${esc(info)}</div></div>
      <div class="running"><span class="num">${done.length ? toPar(sum(done, x => x.score) - sum(done, x => x.par)) : 'E'}</span>
        <span class="muted small">${done.length ? sum(done, x => x.score) + ' thru ' + done.length : 'Not started'}</span></div>
    </div>

    <div class="block">
      <div class="lbl">Score</div>
      <div class="stepper">
        <button class="step" data-act="score" data-d="-1" aria-label="Score down">−</button>
        <button class="val ${h.score == null ? 'ghost' : ''}" data-act="score" data-d="0" aria-label="Set score">${h.score ?? h.par}</button>
        <button class="step" data-act="score" data-d="1" aria-label="Score up">+</button>
      </div>
      <div class="rel">${h.score != null ? esc(relName(h.score, h.par)) : 'Tap the number for par'}</div>
    </div>

    <div class="block">
      <div class="lbl">Putts</div>
      <div class="stepper">
        <button class="step" data-act="putts" data-d="-1" aria-label="Putts down">−</button>
        <button class="val ${h.putts == null ? 'ghost' : ''}" data-act="putts" data-d="0" aria-label="Set putts">${h.putts ?? 2}</button>
        <button class="step" data-act="putts" data-d="1" aria-label="Putts up">+</button>
      </div>
    </div>

    ${h.par > 3 ? `<div class="block"><div class="lbl">Fairway</div><div class="seg">
      ${['Left', 'Hit', 'Right'].map(v => `<button data-act="fw" data-v="${v}" class="${h.fairway === v ? 'on' : ''}">${v}</button>`).join('')}
    </div></div>` : ''}

    <div class="block"><div class="lbl">Green in regulation</div><div class="seg">
      <button data-act="gir" data-v="1" class="${h.gir === true ? 'on' : ''}">Yes</button>
      <button data-act="gir" data-v="0" class="${h.gir === false ? 'on' : ''}">No</button>
    </div></div>

    <div class="block"><label class="lbl" for="hole-note">Hole notes</label>
      <textarea id="hole-note" class="notes-area" data-note="hole" placeholder="Club off the tee, miss, lie, read on the green">${esc(h.notes)}</textarea></div>

    <div class="navrow">
      <button class="btn" data-act="prev" ${i === 0 ? 'disabled' : ''}>Previous</button>
      <button class="btn primary" data-act="${last ? 'finish' : 'next'}">${last ? 'Finish round' : 'Next hole'}</button>
    </div>`;
}

function autoGir(h){
  if (h.girManual || h.score == null || h.putts == null) return;
  h.gir = (h.score - h.putts) <= h.par - 2;
}

function step(field, d){
  const h = S.round.holes[S.holeIdx];
  const base = field === 'score' ? h.par : 2, min = field === 'score' ? 1 : 0;
  if (h[field] == null) h[field] = Math.max(min, base + d);
  else if (d !== 0) h[field] = Math.max(min, h[field] + d);
  autoGir(h); saveDraft(); renderPlay();
}

// ---------- Summary and save
function totals(holes){
  const fw = holes.filter(h => h.par > 3);
  return { score: sum(holes, h => h.score), par: sum(holes, h => h.par), putts: sum(holes, h => h.putts),
    fwHit: fw.filter(h => h.fairway === 'Hit').length, fwCh: fw.length,
    gir: holes.filter(h => h.gir === true).length, n: holes.length };
}

function renderSummary(){
  const r = S.round, t = totals(r.holes), missing = r.holes.filter(h => h.score == null);
  $('#summary').innerHTML = `
    <nav class="top"><button class="link" data-act="back-play">‹ Holes</button></nav>
    <h1>${esc(r.course)}</h1>
    <p class="muted">${esc(fmtDate(r.date))}, ${r.holesPlayed} holes${r.tees ? ', ' + esc(r.tees) + ' tees' : ''}</p>
    ${missing.length ? `<p class="error">No score yet on hole ${missing.map(h => h.hole).join(', ')}.</p>` : ''}
    <div class="stats">
      <div><span class="num">${t.score}</span><span class="muted small">Score (${toPar(t.score - t.par)})</span></div>
      <div><span class="num">${t.putts}</span><span class="muted small">Putts</span></div>
      <div><span class="num">${t.gir}/${t.n}</span><span class="muted small">Greens</span></div>
      <div><span class="num">${t.fwHit}/${t.fwCh}</span><span class="muted small">Fairways</span></div>
    </div>
    <label class="field">Round notes<textarea data-note="round" placeholder="Conditions, what worked, what to practice">${esc(r.notes)}</textarea></label>
    <button class="btn primary big" data-act="save">Save to Google Sheet</button>`;
}

function allocateStrokes(r){
  const par = sum(r.holes, h => h.par), n = r.holes.length;
  if (r.indexBefore == null || r.slope == null || r.rating == null) return r.holes.map(() => 3); // no index: max is par + 5
  const hi = n === 18 ? r.indexBefore : r.indexBefore / 2;
  const ch = Math.round(hi * r.slope / 113 + (r.rating - par));
  const order = r.holes.map((h, i) => ({ i, si: h.si || 100 + i })).sort((a, b) => a.si - b.si);
  const strokes = Array(n).fill(0), give = Math.abs(ch), base = Math.floor(give / n), extra = give % n;
  const seq = ch >= 0 ? order : order.slice().reverse();
  seq.forEach((o, rank) => { strokes[o.i] = (ch >= 0 ? 1 : -1) * (base + (rank < extra ? 1 : 0)); });
  return strokes;
}

function saveRound(){
  const r = S.round, missing = r.holes.filter(h => h.score == null);
  if (missing.length) return toast('Enter a score for hole ' + missing.map(h => h.hole).join(', ') + '.');
  const strokes = allocateStrokes(r);
  const payload = Object.assign({}, r, { par: sum(r.holes, h => h.par),
    holes: r.holes.map((h, k) => ({ hole: h.hole, par: h.par, yards: h.yards, si: h.si, score: h.score, putts: h.putts,
      fairway: h.par > 3 ? h.fairway : null, gir: h.gir, strokes: strokes[k], notes: h.notes })) });
  store(OUTBOX_KEY, outbox().filter(x => x.id !== payload.id).concat([payload]));
  clearDraft(); S.round = null;
  renderHome(); show('home');
  if (!navigator.onLine) toast('Saved on your phone. It uploads when you have signal.');
  flushOutbox();
}

// ---------- Review a saved round
async function openRound(id){
  $('#round').innerHTML = '<nav class="top"><button class="link" data-act="home">‹ Rounds</button></nav><p class="working">Opening round</p>';
  show('round');
  try { S.viewing = await call('getRound', id); renderRound(); }
  catch (e) { $('#round').innerHTML = '<nav class="top"><button class="link" data-act="home">‹ Rounds</button></nav>' +
    `<p class="error">${esc(e.offline ? 'Saved rounds open when you have signal.' : errMsg(e))}</p>`; }
}

function renderRound(){
  const v = S.viewing, t = totals(v.holes);
  const noted = v.holes.filter(h => h.notes);
  $('#round').innerHTML = `
    <nav class="top"><button class="link" data-act="home">‹ Rounds</button></nav>
    <h1>${esc(v.course)}</h1>
    <p class="muted">${esc(fmtDate(v.date))}, ${esc(v.holesPlayed)} holes${v.tees ? ', ' + esc(v.tees) + ' tees' : ''}</p>
    <div class="stats">
      <div><span class="num">${t.score}</span><span class="muted small">Score (${toPar(t.score - t.par)})</span></div>
      <div><span class="num">${v.diff != null ? v.diff.toFixed(1) : '–'}</span><span class="muted small">Differential</span></div>
      <div><span class="num">${t.putts}</span><span class="muted small">Putts</span></div>
      <div><span class="num">${t.gir}/${t.n}</span><span class="muted small">Greens</span></div>
      <div><span class="num">${t.fwHit}/${t.fwCh}</span><span class="muted small">Fairways</span></div>
      <div><span class="num">${esc(v.adjusted ?? '–')}</span><span class="muted small">Adjusted score</span></div>
    </div>
    <div class="strip-wrap"><table class="review"><thead><tr><th>Hole</th><th>Par</th><th>Score</th><th>Putts</th><th>Fairway</th><th>Green</th></tr></thead><tbody>
      ${v.holes.map(h => `<tr><td>${h.hole}</td><td>${h.par}</td><td><span class="sc ${mark(h)}" style="margin:auto">${h.score ?? ''}</span></td>
        <td>${h.putts ?? ''}</td><td>${h.par > 3 ? esc(h.fairway || '') : ''}</td><td>${h.gir === true ? 'Yes' : h.gir === false ? 'No' : ''}</td></tr>`).join('')}
    </tbody></table></div>
    ${v.notes ? `<h2>Round notes</h2><p>${esc(v.notes)}</p>` : ''}
    ${noted.length ? `<h2>Hole notes</h2>${noted.map(h => `<p><strong>Hole ${h.hole}:</strong> ${esc(h.notes)}</p>`).join('')}` : ''}
    <button class="btn" data-act="edit-round">Edit this round</button>`;
}

// ---------- Events
const actions = {
  home(){ renderHome(); show('home'); },
  new(){ renderNew(); show('new'); },
  resume(){ const d = loadDraft(); if (!d) return; S.round = d.round; S.holeIdx = d.holeIdx; renderPlay(); show('play'); },
  discard(){ if (confirm('Discard the round in progress? Its scores will be deleted from this phone.')){ clearDraft(); renderHome(); } },
  open(el){ openRound(el.dataset.id); },
  manual(){ buildSetup(blankCard(18)); },
  course(el){ buildSetup(cardFromCourse(S.data.courses[Number(el.dataset.i)])); },
  mode(el){ const s = S.setup; s.mode = el.dataset.m; s.rating = s.mode === '18' ? s.rating18 : halfRating(s.rating18); renderSetup(); },
  start(){ startRound(); },
  jump(el){ S.holeIdx = Number(el.dataset.i); saveDraft(); renderPlay(); window.scrollTo(0, 0); },
  prev(){ if (S.holeIdx > 0){ S.holeIdx--; saveDraft(); renderPlay(); window.scrollTo(0, 0); } },
  next(){ S.holeIdx++; saveDraft(); renderPlay(); window.scrollTo(0, 0); },
  score(el){ step('score', Number(el.dataset.d)); },
  putts(el){ step('putts', Number(el.dataset.d)); },
  fw(el){ const h = S.round.holes[S.holeIdx]; h.fairway = h.fairway === el.dataset.v ? null : el.dataset.v; saveDraft(); renderPlay(); },
  gir(el){ const h = S.round.holes[S.holeIdx]; h.gir = el.dataset.v === '1'; h.girManual = true; saveDraft(); renderPlay(); },
  finish(){ renderSummary(); show('summary'); },
  'back-play'(){ renderPlay(); show('play'); },
  save(){ saveRound(); },
  settings(){ renderSettings(false); show('settings'); },
  'cfg-save'(el){ saveSettings(el); },
  flush(){ if (!navigator.onLine) return toast('No signal right now.'); flushOutbox(); },
  'edit-round'(){
    const v = S.viewing;
    S.round = { id: v.id, date: v.date, course: v.course, tees: v.tees, holesPlayed: v.holesPlayed, rating: v.rating,
      slope: v.slope, indexBefore: v.indexBefore, notes: v.notes, card: null,
      holes: v.holes.map(h => Object.assign({}, h, { girManual: true })) };
    S.holeIdx = 0; saveDraft(); renderPlay(); show('play');
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.note === 'hole' && S.round){ S.round.holes[S.holeIdx].notes = el.value; saveDraft(); }
  else if (el.dataset.note === 'round' && S.round){ S.round.notes = el.value; saveDraft(); }
  else if (S.setup && !$('#setup').hidden && (el.dataset.f || el.dataset.h != null) && el.tagName !== 'SELECT') setupInput(el);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'photo' && el.files && el.files[0]) onPhoto(el.files[0]);
  else if (el.tagName === 'SELECT' && S.setup) setupInput(el);
});

boot();
</script>
</body>
</html>
